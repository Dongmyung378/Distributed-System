<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Message delivery &amp; reservation recovery</title><desc>Two independent applications, two classes of network failure</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}</style><rect width="1200" height="720" rx="28" fill="#141721"/><text x="64" y="88" fill="#F4F4F8" font-size="38" font-weight="700">Message delivery &amp; reservation recovery</text><text x="64" y="132" fill="#B9BED0" font-size="22">Two independent applications, two classes of network failure</text><text x="64" y="200" fill="#C4B5FD" font-size="19" font-weight="700">TCP CHAT</text><rect x="64" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="230" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">Clients</text><text x="230" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">Newline-framed commands</text><path d="M404 288h20m-7-6 7 6-7 6" stroke="#C4B5FD" stroke-width="2" fill="none"/><rect x="434" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="600" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">Receive thread + send queue</text><text x="600" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">Isolate a stalled peer</text><path d="M774 288h20m-7-6 7 6-7 6" stroke="#C4B5FD" stroke-width="2" fill="none"/><rect x="804" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="970" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">Healthy receivers</text><text x="970" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">Observed deliveries</text><text x="64" y="422" fill="#F1BF75" font-size="19" font-weight="700">HTTP RESERVATIONS</text><rect x="64" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="230" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">CLI + recovery journal</text><text x="230" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">Persist intent before requests</text><path d="M404 510h20m-7-6 7 6-7 6" stroke="#F1BF75" stroke-width="2" fill="none"/><rect x="434" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="600" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">Hotel / Band API</text><text x="600" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">Retry the same operation key</text><path d="M774 510h20m-7-6 7 6-7 6" stroke="#F1BF75" stroke-width="2" fill="none"/><rect x="804" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="970" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">SQLite transaction</text><text x="970" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">Mutation + durable receipt</text><text x="64" y="650" fill="#B9BED0" font-size="22">Isolate stalled readers. Preserve uncertain booking outcomes for recovery.</text></svg>
