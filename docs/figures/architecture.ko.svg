<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>메시지 전달과 예약 복구</title><desc>독립된 두 애플리케이션에서 다루는 네트워크 장애</desc><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}</style><rect width="1200" height="720" rx="28" fill="#141721"/><text x="64" y="88" fill="#F4F4F8" font-size="38" font-weight="700">메시지 전달과 예약 복구</text><text x="64" y="132" fill="#B9BED0" font-size="22">독립된 두 애플리케이션에서 다루는 네트워크 장애</text><text x="64" y="200" fill="#C4B5FD" font-size="19" font-weight="700">TCP 채팅</text><rect x="64" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="230" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">클라이언트</text><text x="230" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">줄바꿈 명령</text><path d="M404 288h20m-7-6 7 6-7 6" stroke="#C4B5FD" stroke-width="2" fill="none"/><rect x="434" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="600" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">연결별 수신 + 송신 큐</text><text x="600" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">느린 연결 격리</text><path d="M774 288h20m-7-6 7 6-7 6" stroke="#C4B5FD" stroke-width="2" fill="none"/><rect x="804" y="224" width="332" height="128" rx="14" fill="#1E2230" stroke="#C4B5FD" stroke-width="1.5"/><text x="970" y="277" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">정상 수신자</text><text x="970" y="316" text-anchor="middle" fill="#B9BED0" font-size="18">전달 관찰</text><text x="64" y="422" fill="#F1BF75" font-size="19" font-weight="700">HTTP 예약</text><rect x="64" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="230" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">CLI + 복구 저널</text><text x="230" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">요청 전 의도 기록</text><path d="M404 510h20m-7-6 7 6-7 6" stroke="#F1BF75" stroke-width="2" fill="none"/><rect x="434" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="600" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">호텔 / 밴드 API</text><text x="600" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">동일 작업 키로 재시도</text><path d="M774 510h20m-7-6 7 6-7 6" stroke="#F1BF75" stroke-width="2" fill="none"/><rect x="804" y="446" width="332" height="128" rx="14" fill="#1E2230" stroke="#F1BF75" stroke-width="1.5"/><text x="970" y="499" text-anchor="middle" fill="#F4F4F8" font-size="22" font-weight="600">SQLite 트랜잭션</text><text x="970" y="538" text-anchor="middle" fill="#B9BED0" font-size="18">변경 + 처리 기록</text><text x="64" y="650" fill="#B9BED0" font-size="22">읽지 않는 연결을 격리하고, 불확실한 예약 결과는 보존하여 재확인합니다.</text></svg>